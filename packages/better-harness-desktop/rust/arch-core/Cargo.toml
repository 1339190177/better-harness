[package]
name = "arch-core"
version = "0.1.0"
description = "Architecture fact extraction, graph, and C4 projection for Better Harness."
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
oxc_allocator = "=0.147.0"
oxc_ast = "=0.147.0"
oxc_parser = "=0.147.0"
oxc_span = "=0.147.0"
oxc_str = "=0.147.0"
oxc_ast_visit = "=0.147.0"
oxc_syntax = "=0.147.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
strip = true