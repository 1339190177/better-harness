[package]
name = "difftastic-core"
version = "0.71.0"
description = "Vendored difftastic structural-diff engine, built as a library for Better Harness."
license = "MIT"
edition = "2021"
rust-version = "1.85.0"
publish = false

# Upstream ships a binary crate only. This crate adds a library target so
# `harness-diff-service` can call the engine in-process; `src/bridge.rs` is the
# only added surface, and `src/` is otherwise unmodified apart from the
# language removal recorded in docs/specs/2026-09-14-structural-commit-diff.md.
[lib]
name = "difftastic_core"
path = "src/lib.rs"
# The module docs contain AST sketches and pseudo-code (for example
# `(old-1 (novel (old-2)))`), which are prose for readers. They were never
# compiled upstream, because upstream ships no library target.
doctest = false

[dependencies]
regex = "1.10.4"
clap = { version = "4.0.0", features = ["cargo", "env", "wrap_help", "string"] }
typed-arena = "2.0.2"
rustc-hash = "2.0.0"
strsim = "0.11.0"
lazy_static = "1.4.0"
libc = "0.2.108"
log = "0.4.14"
pretty_env_logger = "0.5.0"

radix-heap = "0.4.2"
# ignore does not declare a MSRV, but it's part of ripgrep, which has
# a slightly more aggressive MSRV than difftastic. Ignore 0.4.30
# requires rust 1.88.
ignore = ">= 0.4, < 0.4.30"
owo-colors = "4.2.3"
imara-diff = { version = "0.2.0", default-features = false }
rayon = "1.7.0"
tree_magic_mini = "3.2.0"

bumpalo = "3.18.0"
unicode-width = "0.2.0"
terminal_size = "0.4.1"
glob = "0.3.2"
strum = { version = "0.28", features = ["derive"] }
hashbrown = "0.17.0"
humansize = "2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
line-numbers = "0.3.0"
smallvec = "1.13.2"
streaming-iterator = "0.1.9"
encoding_rs = "0.8.35"

# tree-sitter itself.
#
# Note that tree-sitter 0.26.11 is currently not compatible with
# tree-sitter-solidity: https://github.com/JoranHonig/tree-sitter-solidity/pull/80
tree-sitter = "0.26.10"
tree-sitter-language = "0.1.7"

# tree-sitter parsers that are available on crates.io. The grammars upstream
# vendors as C sources (Janet, Kotlin, LaTeX, Smali) are not part of this build.
tree-sitter-asm = "0.24.0"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-clojure-orchard = "0.2.5"
tree-sitter-cmake = "0.7.1"
tree-sitter-containerfile = "0.8.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-elisp = "1.7.0"
tree-sitter-elixir = "0.3.4"
tree-sitter-fish = "3.6.0"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java-orchard = "0.5.9"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1.1"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.25.0"
tree-sitter-php = "0.24.0"
tree-sitter-proto = "0.4.0"
tree-sitter-python = "0.25.0"
tree-sitter-qmljs = "0.3.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust-orchard = "0.16.6"
tree-sitter-scala = "0.26.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.1"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.0"
tree-sitter-zig = "1.1.2"
ts-parser-perl = "1.2.0"

# Upstream's in-crate unit tests stay runnable; only the CLI integration test's
# dependencies (assert_cmd, predicates) are dropped with that test.
[dev-dependencies]
pretty_assertions = "1.3.0"
